short_bio: >-
  <p>
    I am a Ph.D. candidate at the <a href="https://muroran-it.ac.jp/" target="_blank">Muroran Institute of Technology</a>
    (<a href="https://u.muroran-it.ac.jp/enes/people.html" target="_blank">ENeS Lab</a>), supervised by
    <a href="https://u.muroran-it.ac.jp/enes/~mxdong/index.html" target="_blank">Prof. Mianxiong Dong</a> and
    <a href="https://u.muroran-it.ac.jp/enes/~ota/index.html" target="_blank">Prof. Kaoru Ota</a>, with support from
    the China Scholarship Council (CSC). I obtained my M.Eng. and B.Eng. degrees from
    <a href="https://www.suda.edu.cn/" target="_blank">Soochow University</a> in 2024 and 2021.
  </p>
  <p>
    Currently, my research mainly focuses on brain decoding and generation, especially cross-subject
    fMRI-to-video reconstruction and diffusion-based EEG synthesis. Prior to this, I worked on
    time series analysis, including nonstationary forecasting and data augmentation.
  </p>
  <p>
    <strong>I expect to complete my Ph.D. in October 2027 and am looking for postdoctoral positions.</strong>
  </p>

