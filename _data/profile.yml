short_bio: >-
  <p>
    I am a Ph.D. candidate in Computer Science at the
    <a href="https://muroran-it.ac.jp/" target="_blank">Muroran Institute of Technology</a>, Japan,
    advised by Prof. Mianxiong Dong and Prof. Kaoru Ota. My Ph.D. study is supported by the
    China Scholarship Council (CSC). Before that, I received my M.Eng. in Control Science and Engineering
    and B.Eng. in Electrical Engineering and Automation from
    <a href="https://www.suda.edu.cn/" target="_blank">Soochow University</a>, China.
  </p>
  <p>
    My research focuses on brain&ndash;computer interfaces and neural decoding. I build diffusion-based
    generative models that synthesize physiologically consistent EEG signals, and cross-subject
    frameworks that reconstruct videos from fMRI. Earlier, I worked on forecasting and data augmentation
    for nonstationary time series.
  </p>
  <p>
    <strong>I expect to complete my Ph.D. in October 2027 and am looking for postdoctoral positions.</strong>
  </p>

