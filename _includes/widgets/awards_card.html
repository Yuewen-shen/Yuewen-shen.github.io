<div class="my-3 bg-white shadow-sm rounded-xl">
    <h6 class="p-3 mb-0 border-bottom border-gray"><i class="fas fa-trophy"></i> Honors & Awards</h6>
    <div class="px-3 py-2 small">
        <ul class="list pl-3 mb-1">
            {% for item in site.data.profile.awards %}
            <li class="my-1">
                <div class="d-flex">
                    <div>{{ item.name }}</div>
                    <div class="ml-auto mt-auto pl-3 no-break text-muted"><em>{{ item.date }}</em></div>
                </div>
            </li>
            {% endfor %}
        </ul>
    </div>
</div>
